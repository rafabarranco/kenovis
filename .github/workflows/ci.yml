name: CI

on:
  push:
    branches: [main, development, preproduction]
  pull_request:
    branches: [main, development, preproduction]

permissions:
  contents: read

jobs:
  docs-integrity:
    name: Markdown links, markers, template references and artifact destinations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check relative markdown links resolve
        run: python3 .github/scripts/check_links.py

      - name: Check PROJECT-SPECIFIC marker convention
        run: python3 .github/scripts/check_markers.py

      - name: Check framework-layer changes update CHANGELOG.md
        run: python3 .github/scripts/check_changelog.py

      - name: Check no template path is offered as a destination
        run: python3 .github/scripts/check_template_refs.py

      - name: Check every produced artifact names where it goes
        run: python3 .github/scripts/check_artifact_destinations.py

      - name: Check every decision has a Decision Index line
        run: python3 .github/scripts/check_decision_index.py

      - name: Check every future action has a disposition
        run: python3 .github/scripts/check_future_actions.py

      - name: Check governed documents stay inside the lifecycle rule
        run: python3 .github/scripts/check_document_size.py

      - name: Check every promoted learning is findable in its policy
        run: python3 .github/scripts/check_learning_promotions.py

      - name: Check every closed item declares what it left behind
        run: python3 .github/scripts/check_item_findings.py

  cli-tests:
    name: cli/ build, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Type check
        working-directory: cli
        run: npm run typecheck

      - name: Test
        working-directory: cli
        run: npm test
